# Baserow en la Mac mini, publicado solo por ngrok con login de Microsoft.
# No publica ningun puerto: el agente de ngrok llega a Baserow por la red interna de Docker.
# Las reglas de acceso estan en ngrok-policy.yml.
name: baserow

services:
  baserow:
    image: baserow/baserow:2.4.1  # misma version que el respaldo; actualizar despues de restaurar
    restart: unless-stopped
    # Baserow procesa las subidas en /dev/shm; con los 64 MB por defecto de Docker,
    # archivos de ~40 MB ya fallan con "No space left on device". Probado: 400 MB pasan con 1 GB.
    shm_size: "1gb"
    environment:
      BASEROW_PUBLIC_URL: ${BASEROW_PUBLIC_URL:?Falta BASEROW_PUBLIC_URL en .env}
      # Vacio = Baserow bloquea webhooks a IPs privadas (incluida Tailscale).
      BASEROW_WEBHOOKS_ALLOW_PRIVATE_ADDRESS: ${BASEROW_WEBHOOKS_ALLOW_PRIVATE_ADDRESS:-}
    volumes:
      - baserow_data:/baserow/data

  ngrok:
    image: ngrok/ngrok:3.39.13-alpine
    restart: unless-stopped
    command:
      - http
      - http://baserow:80
      - --url
      - ${BASEROW_PUBLIC_URL:?Falta BASEROW_PUBLIC_URL en .env}
      - --traffic-policy-file
      - /etc/ngrok/policy.yml
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Falta NGROK_AUTHTOKEN en .env}
    volumes:
      - ./ngrok-policy.yml:/etc/ngrok/policy.yml:ro
    depends_on:
      - baserow

volumes:
  baserow_data: {}
